    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b6e64" />

      Three type roles: Plus Jakarta Sans carries headings and the brand, Inter
      carries the interface, JetBrains Mono carries signature hashes and refs.
      Weights are kept deliberately narrow — the initial bundle is already over
      its budget, so every extra face has to earn its place.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=block"
      rel="stylesheet"
    />
  </head>
